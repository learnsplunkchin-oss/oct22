---
# ============================================================
# Collector and expected hosts
# ============================================================

dnf_collector_host: vm1

dnf_expected_hosts:
  - vm1
  - vm2
  - vm3
  - vm4
  - vm5
  - vm6
  - vm7

# ============================================================
# Runtime directories on vm1
# ============================================================

dnf_upgrade_base_dir: /var/lib/os_patching/current
dnf_upgrade_pre_dir: "{{ dnf_upgrade_base_dir }}/pre"
dnf_upgrade_post_dir: "{{ dnf_upgrade_base_dir }}/post"
dnf_upgrade_status_dir: "{{ dnf_upgrade_base_dir }}/status"


# ============================================================
# Report output
# ============================================================

dnf_upgrade_report_dir: "{{ dnf_upgrade_base_dir }}/report"
dnf_host_report_dir: "{{ dnf_upgrade_report_dir }}"
dnf_assessment_json: "{{ dnf_upgrade_report_dir }}/assessment.json"
dnf_dashboard_html: "{{ dnf_upgrade_report_dir }}/os_patching_dashboard.html"
dnf_server_status_dashboard_file: "{{ dnf_upgrade_report_dir }}/server-status.html"
# ============================================================
# Centralized generator and templates
# ============================================================

dnf_assessment_script: "{{ dnf_upgrade_base_dir }}/generate_dnf_assessment.py"
dnf_template_dir: "{{ dnf_upgrade_base_dir }}/templates"

dnf_dashboard_template: os_patch_dashboard.html.j2
dnf_detail_template: os_patch_detail.html.j2
dnf_dashboard_title: "RHEL OS Patching Assessment"

# ============================================================
# Report metadata
# ============================================================

dnf_report_timezone: Asia/Singapore
dnf_report_owner: root
dnf_report_group: root
dnf_report_directory_mode: "0750"
dnf_report_file_mode: "0640"

# ============================================================
# Conservative assessment policy
# ============================================================

dnf_missing_evidence_status: INCOMPLETE
dnf_no_patch_job_status: UNKNOWN
dnf_failed_patch_status: FAILED

# ============================================================
# OS patch assessment email report
# ============================================================

dnf_email_enabled: true

dnf_email_subject: "RHEL OS Patching Assessment Report"

dnf_email_sender: "ansible-reports@example.com"

dnf_email_recipients:
  - "platform-operations@example.com"

dnf_email_cc: []

dnf_email_body: |
  Dear Team,

  Please find attached the RHEL OS Patching Assessment Report.
  Download into the same folder for viewing.
  Attachments:
  - Executive dashboard
  - Individual HTML assessment reports for IaC Platform Servers

  Please review the assessment status, evidence completeness,
  patch job results, and remaining package updates.

  Regards,
  IaC Support

# ============================================================
# SMTP server configuration
# Replace these examples with your approved SMTP settings.
# ============================================================

dnf_smtp_host: "smtp.example.com"
dnf_smtp_port: 587
dnf_smtp_secure: "starttls"

# Use Ansible Vault for credentials if authentication is required.
dnf_smtp_username: ""
dnf_smtp_password: ""
dnf_smtp_auth_required: false
dnf_evidence_directory_mode: 750
dnf_evidence_file_mode: 640
# ============================================================
# Assessment script and template paths
# ============================================================

dnf_assessment_script: "{{ dnf_upgrade_base_dir }}/scripts/generate_dnf_assessment.py"
dnf_template_dir: "{{ dnf_upgrade_base_dir }}/templates"

dnf_dashboard_template: os_patch_dashboard.html.j2
dnf_detail_template: os_patch_detail.html.j2

dnf_email_dry_run: true
dnf_email_sender: "patching-reports@ncs.com.sg"
# ============================================================
# SMTP server configuration (NCS approved settings)
# ============================================================
# If authentication is required
dnf_smtp_username: "patching-reports@ncs.com.sg"
dnf_smtp_password: !vault |
          \$ANSIBLE_VAULT;1.1;AES256
          ... (use ansible-vault to encrypt)

dnf_smtp_auth_required: true

# Email settings
dnf_email_enabled: true
dnf_email_recipients:
  - "platform-operations@ncs.com.sg"
  - "infrastructure-team@ncs.com.sg"

dnf_email_cc:
  - "manager-infrastructure@ncs.com.sg"

# Source file on the Ansible controller, stored in the role's files directory.
dnf_chartjs_filename: chart.umd.min.js

# Destination on the collector host.
dnf_chartjs_remote_file: "{{ dnf_upgrade_report_dir }}/chart.umd.min.js"

