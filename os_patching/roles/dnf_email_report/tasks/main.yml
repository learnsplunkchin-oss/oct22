---
# ============================================================
# DNF Email Report Role - Send Assessment Reports via Email
# ============================================================

- name: Validate email configuration
  ansible.builtin.assert:
    that:
      - dnf_email_enabled is defined
      - dnf_email_enabled | bool
      - dnf_email_sender is defined
      - dnf_email_recipients is defined
      - dnf_email_recipients | length > 0
      - dnf_email_subject is defined
      - dnf_dashboard_html is defined
      - dnf_upgrade_report_dir is defined
      - dnf_expected_hosts is defined
    fail_msg: "Email configuration is incomplete in group_vars/all.yml"

- name: Skip email report if disabled
  ansible.builtin.debug:
    msg: "Email reporting is disabled (dnf_email_enabled=false). Skipping."
  when: not (dnf_email_enabled | bool)

- name: End play if email is disabled
  ansible.builtin.meta: end_play
  when: not (dnf_email_enabled | bool)

# ============================================================
# Verify all report files exist before building attachment list
# ============================================================

- name: Verify dashboard HTML exists
  ansible.builtin.stat:
    path: "{{ dnf_dashboard_html }}"
  register: dashboard_check
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Fail if dashboard is missing
  ansible.builtin.fail:
    msg: "Dashboard HTML not found: {{ dnf_dashboard_html }}"
  when: not dashboard_check.stat.exists

- name: Verify host detail reports exist
  ansible.builtin.stat:
    path: "{{ dnf_upgrade_report_dir }}/{{ item }}.html"
  loop: "{{ dnf_expected_hosts }}"
  register: host_reports_check
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Identify missing host reports
  ansible.builtin.set_fact:
    missing_reports: "{{ host_reports_check.results | selectattr('stat.exists', 'equalto', false) | map(attribute='item') | list }}"

- name: Fail if any host reports are missing
  ansible.builtin.fail:
    msg: "Missing host reports: {{ missing_reports | join(', ') }}"
  when: missing_reports | length > 0

# ============================================================
# Build attachment list (dashboard + all host reports)
# ============================================================

- name: Build dashboard attachment
  ansible.builtin.set_fact:
    dnf_email_attachments:
      - "{{ dnf_dashboard_html }}"

- name: Add host detail report attachments
  ansible.builtin.set_fact:
    dnf_email_attachments: "{{ dnf_email_attachments + [dnf_upgrade_report_dir + '/' + item + '.html'] }}"
  loop: "{{ dnf_expected_hosts }}"

# ============================================================
# Email attachment preflight validation
# ============================================================

- name: Display email attachment list for validation
  ansible.builtin.debug:
    msg:
      - "Email dry-run mode: {{ dnf_email_dry_run | default(false) | bool }}"
      - "Expected attachment count: {{ 1 + (dnf_expected_hosts | length) }}"
      - "Actual attachment count: {{ dnf_email_attachments | length }}"
      - "Attachments:"
      - "{{ dnf_email_attachments }}"

- name: Assert attachment count is correct
  ansible.builtin.assert:
    that:
      - dnf_email_attachments | length == (1 + (dnf_expected_hosts | length))
    fail_msg: >-
      Attachment count mismatch.
      Expected {{ 1 + (dnf_expected_hosts | length) }},
      got {{ dnf_email_attachments | length }}.
    success_msg: >-
      Attachment count is correct:
      {{ dnf_email_attachments | length }} files.

- name: Verify all email attachments exist on collector
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ dnf_email_attachments }}"
  register: dnf_email_attachment_stats
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Check if all email attachments exist
  ansible.builtin.assert:
    that:
      - item.stat is defined
      - item.stat.exists | default(false)
    fail_msg: >-
      Attachment file does not exist:
      {{ item.item }}
    success_msg: >-
      Attachment exists:
      {{ item.item }}
  loop: "{{ dnf_email_attachment_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check if all email attachments are not empty
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - item.stat.size | default(0) | int > 0
    fail_msg: >-
      Attachment is empty or not a regular file:
      {{ item.item }}
      (size={{ item.stat.size | default(0) }} bytes)
    success_msg: >-
      Attachment is valid:
      {{ item.item }}
      (size={{ item.stat.size }} bytes)
  loop: "{{ dnf_email_attachment_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat is defined and item.stat.exists | default(false)

- name: Confirm expected dashboard attachment filename
  ansible.builtin.assert:
    that:
      - dnf_dashboard_html | basename == "os_patching_dashboard.html"
    fail_msg: >-
      Dashboard filename is not os_patching_dashboard.html.
      Current value: {{ dnf_dashboard_html | basename }}.
      The email instruction and dashboard links expect os_patching_dashboard.html.
    success_msg: "Dashboard filename is correct: os_patching_dashboard.html"

- name: Confirm expected host detail filenames
  ansible.builtin.assert:
    that:
      - item + ".html" in (dnf_email_attachments | map('basename') | list)
    fail_msg: >-
      Missing host detail attachment for {{ item }}.
      Expected filename: {{ item }}.html
    success_msg: >-
      Host detail attachment found:
      {{ item }}.html
  loop: "{{ dnf_expected_hosts }}"

- name: Confirm attachments are in the report folder
  ansible.builtin.assert:
    that:
      - item.startswith(dnf_upgrade_report_dir ~ '/')
    fail_msg: >-
      Attachment is not in the report directory:
      {{ item }}
      Expected directory:
      {{ dnf_upgrade_report_dir }}
    success_msg: >-
      Attachment is in report directory:
      {{ item }}
  loop: "{{ dnf_email_attachments }}"
  loop_control:
    label: "{{ item }}"

- name: Display attachment basenames for final confirmation
  ansible.builtin.debug:
    msg:
      - "These files will be attached to one email:"
      - "{{ dnf_email_attachments | map('basename') | list }}"

# ============================================================
# Load assessment summary for email body
# ============================================================

- name: Load assessment JSON for email body
  ansible.builtin.slurp:
    src: "{{ dnf_assessment_json }}"
  register: assessment_json_content
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Parse assessment summary
  ansible.builtin.set_fact:
    assessment_summary: "{{ assessment_json_content.content | b64decode | from_json }}"

# ============================================================
# Generate email body using template
# ============================================================

- name: Generate email body from template
  ansible.builtin.template:
    src: email_body.txt.j2
    dest: "{{ dnf_upgrade_report_dir }}/email_body.txt"
    owner: "{{ dnf_report_owner | default('root') }}"
    group: "{{ dnf_report_group | default('root') }}"
    mode: "0640"
  vars:
    assessment: "{{ assessment_summary }}"
    expected_hosts: "{{ dnf_expected_hosts }}"
    base_dir: "{{ dnf_upgrade_base_dir }}"
    attachment_count: "{{ dnf_email_attachments | length }}"
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Load generated email body
  ansible.builtin.slurp:
    src: "{{ dnf_upgrade_report_dir }}/email_body.txt"
  register: email_body_file
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Set email body content
  ansible.builtin.set_fact:
    dnf_email_body_content: "{{ email_body_file.content | b64decode }}"

# ============================================================
# Send single email with all attachments (skip if dry-run)
# ============================================================

- name: Send assessment report email with all attachments
  community.general.mail:
    host: "{{ dnf_smtp_host }}"
    port: "{{ dnf_smtp_port }}"
    secure: "{{ dnf_smtp_secure | default('starttls') }}"
    username: "{{ dnf_smtp_username | default(omit) }}"
    password: "{{ dnf_smtp_password | default(omit) }}"
    from: "{{ dnf_email_sender }}"
    to: "{{ dnf_email_recipients }}"
    cc: "{{ dnf_email_cc | default([]) }}"
    subject: "{{ dnf_email_subject }} - {{ assessment_summary.assessment.generated_at }}"
    body: "{{ dnf_email_body_content }}"
    attach: "{{ dnf_email_attachments }}"
    charset: utf8
  delegate_to: "{{ dnf_collector_host }}"
  become: true
  register: email_result
  ignore_errors: true
  when:
    - not (dnf_email_dry_run | default(false) | bool)

# ============================================================
# Report email send result
# ============================================================

- name: Calculate total attachment size
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ dnf_email_attachments }}"
  register: attachment_sizes
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Calculate total size in bytes
  ansible.builtin.set_fact:
    total_attachment_size: "{{ attachment_sizes.results | map(attribute='stat.size') | sum }}"

- name: Display email send success
  ansible.builtin.debug:
    msg: |
      ==========================================
      Email Report Sent Successfully
      ==========================================
      From: {{ dnf_email_sender }}
      To: {{ dnf_email_recipients | join(', ') }}
      CC: {{ dnf_email_cc | default([]) | join(', ') }}
      Subject: {{ dnf_email_subject }}
      
      Attachments: {{ dnf_email_attachments | length }} files
      Total Size: {{ (total_attachment_size | int / 1024 / 1024) | round(2) }} MB
      
      Files Attached:
        - os_patching_dashboard.html
      {% for host in dnf_expected_hosts %}
        - {{ host }}.html
      {% endfor %}
      ==========================================
  when:
    - not (dnf_email_dry_run | default(false) | bool)
    - email_result is succeeded

- name: Display email send failure
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "WARNING: Email Report Failed to Send"
      - "=========================================="
      - "Error: {{ email_result.msg | default('Unknown error') }}"
      - ""
      - "Reports are still available on collector host:"
      - "  Host: {{ dnf_collector_host }}"
      - "  Directory: {{ dnf_upgrade_report_dir }}"
      - "  Dashboard: {{ dnf_dashboard_html }}"
      - ""
      - "You can manually retrieve reports using:"
      - "  scp -r {{ dnf_collector_host }}:{{ dnf_upgrade_report_dir }}/ ./os_patching_reports/"
      - "=========================================="
  when:
    - not (dnf_email_dry_run | default(false) | bool)
    - email_result is failed

- name: Email dry-run summary
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "EMAIL DRY RUN COMPLETE - NO EMAIL SENT"
      - "=========================================="
      - "SMTP send was skipped because dnf_email_dry_run=true."
      - "Attachment logic has been validated."
      - ""
      - "From: {{ dnf_email_sender }}"
      - "To: {{ dnf_email_recipients | join(', ') }}"
      - "CC: {{ dnf_email_cc | default([]) | join(', ') }}"
      - "Subject: {{ dnf_email_subject }} - {{ assessment_summary.assessment.generated_at }}"
      - ""
      - "Attachment count: {{ dnf_email_attachments | length }}"
      - "Total size: {{ (total_attachment_size | int / 1024 / 1024) | round(2) }} MB"
      - ""
      - "Attachments:"
      - "{{ dnf_email_attachments | map('basename') | list }}"
      - ""
      - "Expected user instruction:"
      - "Download all attached HTML files into the same folder."
      - "Open os_patching_dashboard.html first."
      - "Use dashboard links to open vm1.html through vm7.html."
      - "=========================================="
  when:
    - dnf_email_dry_run | default(false) | bool

- name: Fail if email send failed and email is required
  ansible.builtin.fail:
    msg: "Email report failed to send. Reports are available on {{ dnf_collector_host }}:{{ dnf_upgrade_report_dir }}"
  when:
    - not (dnf_email_dry_run | default(false) | bool)
    - email_result is failed
    - dnf_email_required | default(false) | bool

