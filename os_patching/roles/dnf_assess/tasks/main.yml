---
- name: Validate DNF assessment configuration
  ansible.builtin.assert:
    that:
      - dnf_collector_host is defined
      - dnf_expected_hosts is defined
      - dnf_expected_hosts | length > 0
      - dnf_upgrade_base_dir is defined
      - dnf_assessment_json is defined
      - dnf_dashboard_html is defined
      - dnf_upgrade_report_dir is defined
    fail_msg: "Missing required dnf_assess configuration."

- name: Create assessment output directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ dnf_report_owner }}"
    group: "{{ dnf_report_group }}"
    mode: "{{ dnf_report_directory_mode }}"
  loop:
    - "{{ dnf_upgrade_base_dir }}"
    - "{{ dnf_upgrade_report_dir }}"
    - "{{ dnf_upgrade_base_dir }}/scripts"
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Install assessment generator on collector
  ansible.builtin.copy:
    src: generate_dnf_assessment.py
    dest: "{{ dnf_upgrade_base_dir }}/scripts/generate_dnf_assessment.py"
    owner: "{{ dnf_report_owner }}"
    group: "{{ dnf_report_group }}"
    mode: "0750"
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Copy Chart.js bundle to collector report directory
  ansible.builtin.copy:
    src: chart.umd.min.js
    dest: "{{ dnf_upgrade_report_dir }}/chart.umd.min.js"
    owner: "{{ dnf_report_owner }}"
    group: "{{ dnf_report_group }}"
    mode: "0640"
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Read Chart.js bundle from collector report directory
  ansible.builtin.slurp:
    src: "{{ dnf_upgrade_report_dir }}/chart.umd.min.js"
  register: dnf_chartjs_slurp
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Set Chart.js source for standalone dashboard
  ansible.builtin.set_fact:
    dnf_chartjs_source: "{{ dnf_chartjs_slurp.content | b64decode }}"

- name: Generate normalized assessment JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ dnf_upgrade_base_dir }}/scripts/generate_dnf_assessment.py"
      - --base-dir
      - "{{ dnf_upgrade_base_dir }}"
      - --expected-hosts
      - "{{ dnf_expected_hosts | join(',') }}"
      - --output
      - "{{ dnf_assessment_json }}"
      - --collector-host
      - "{{ dnf_collector_host }}"
  register: dnf_assessment_generation
  changed_when: true
  failed_when: dnf_assessment_generation.rc not in [0, 2]
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Load generated assessment JSON
  ansible.builtin.slurp:
    src: "{{ dnf_assessment_json }}"
  register: dnf_assessment_json_content
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Parse generated assessment JSON
  ansible.builtin.set_fact:
    dnf_assessment_data: >-
      {{ dnf_assessment_json_content.content | b64decode | from_json }}

- name: Validate normalized assessment schema
  ansible.builtin.assert:
    that:
      - dnf_assessment_data.summary is defined
      - dnf_assessment_data.hosts is defined
      - dnf_assessment_data.summary.hosts is defined
      - dnf_assessment_data.hosts | length == dnf_expected_hosts | length
    fail_msg: >-
      Generated assessment JSON does not match the expected schema.
      Check the evidence files and generate_dnf_assessment.py.

- name: Render standalone executive dashboard
  ansible.builtin.template:
    src: os_patch_dashboard.html.j2
    dest: "{{ dnf_dashboard_html }}"
    owner: "{{ dnf_report_owner }}"
    group: "{{ dnf_report_group }}"
    mode: "{{ dnf_report_file_mode }}"
  vars:
    assessment: "{{ dnf_assessment_data }}"
    chartjs_source: "{{ dnf_chartjs_source }}"
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Verify executive dashboard exists and is not empty
  ansible.builtin.stat:
    path: "{{ dnf_dashboard_html }}"
  register: dnf_dashboard_stat
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Copy Chart.js to collector report directory
  ansible.builtin.copy:
    src: chart.umd.min.js
    dest: "{{ dnf_upgrade_report_dir }}/chart.umd.min.js"
    mode: "0644"
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Read Chart.js source from collector report directory
  ansible.builtin.slurp:
    src: "{{ dnf_upgrade_report_dir }}/chart.umd.min.js"
  register: dnf_chartjs_content
  delegate_to: "{{ dnf_collector_host }}"
  become: true

- name: Set Chart.js source for standalone dashboard
  ansible.builtin.set_fact:
    dnf_chartjs_source: "{{ dnf_chartjs_content.content | b64decode }}"

- name: Assert executive dashboard was generated
  ansible.builtin.assert:
    that:
      - dnf_dashboard_stat.stat.exists
      - dnf_dashboard_stat.stat.isreg
      - dnf_dashboard_stat.stat.size | int > 0
    fail_msg: "Executive dashboard was not generated or is empty."

- name: Display assessment summary
  ansible.builtin.debug:
    msg:
      - "DNF OS Patching Assessment Complete"
      - "Collector Host: {{ dnf_assessment_data.collector_host | default(dnf_collector_host) }}"
      - "Assessment JSON: {{ dnf_assessment_json }}"
      - "Executive Dashboard: {{ dnf_dashboard_html }}"
      - "Total Hosts: {{ dnf_assessment_data.summary.hosts | default(dnf_assessment_data.hosts | length) }}"
      - "PASS: {{ dnf_assessment_data.summary.pass | default(0) }}"
      - "UPDATES REMAIN: {{ dnf_assessment_data.summary.updates_remain | default(0) }}"
      - "PATCH FAILED: {{ dnf_assessment_data.summary.patch_failed | default(0) }}"
      - "INCOMPLETE: {{ dnf_assessment_data.summary.incomplete | default(0) }}"
      - >-
        Pre-check kernel / regular:
        {{ dnf_assessment_data.summary.precheck_kernel | default(0) }} /
        {{ dnf_assessment_data.summary.precheck_regular | default(0) }}
      - >-
        Post-check kernel / regular:
        {{ dnf_assessment_data.summary.postcheck_kernel | default(0) }} /
        {{ dnf_assessment_data.summary.postcheck_regular | default(0) }}

- name: Set assessment completion facts
  ansible.builtin.set_fact:
    dnf_assessment_complete: true
    dnf_assessment_summary: "{{ dnf_assessment_data.summary }}"


