[defaults]
# Inventory file location
inventory = ./inventory/inventory.ini

# Disable host key checking (useful for new hosts)
host_key_checking = False

# Set the remote user
remote_user = salocal

# Enable SSH pipelining for better performance
pipelining = True

# Set privilege escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# Logging
log_path = ./ansible.log

# Retry files location
retry_files_enabled = True
retry_files_save_path = ./retry

[privilege_escalation]
become = True
become_method = sudo
become_user = root
